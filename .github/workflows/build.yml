name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Zip varsa ac
        run: |
          for f in *.zip; do
            [ -f "$f" ] && unzip -o "$f"
          done
          true
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
